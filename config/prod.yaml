env: "prod"

telegram:
  token: "" # set via env

database:
  host: ""      # set via env
  port: 5432
  user: ""      # set via env
  password: ""  # set via env
  name: ""      # set via env
  sslmode: "require"

llm:
  provider: "openai"
  api_key: ""   # set via env
  model: "gpt-3.5-turbo"
  timeout: 30s
  limits:
    enabled: true                   # false in local.yaml, true in prod.yaml
    max_input_tokens_activities: 1000
    max_input_tokens_stats: 2000
    daily_budget_tokens: 5000
    max_context_chars: 700

server:
  address: ":8080"
  timeout: 4s
  idle_timeout: 120s
