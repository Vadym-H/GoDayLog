name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [dev]
    types: [completed]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/GoDayLog
            git pull
            export PATH=$PATH:/usr/local/go/bin
            task -t Taskfile.prod.yaml migrate:up
            task -t Taskfile.prod.yaml build
