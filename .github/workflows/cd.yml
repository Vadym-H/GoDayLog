name: CD

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/GoDayLog
            git pull
            export PATH=$PATH:/usr/local/go/bin
            task -t Taskfile.prod.yaml migrate:up
            task -t Taskfile.prod.yaml build
